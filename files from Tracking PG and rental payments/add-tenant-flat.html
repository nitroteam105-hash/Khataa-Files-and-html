<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rentals — Add Tenant</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfbf9;--ink:#16161a;--muted:#62636a;--line:#e7e7e2;--card:#fff;
    --accent:#1f6f54;--soft:#e8f3ee;--warm:#f4f2ec;--red:#b3261e;--amber:#b36b00;--ambersoft:#fff4e5;
    --d:'Plus Jakarta Sans',sans-serif;--b:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--b);-webkit-font-smoothing:antialiased;padding-bottom:88px;}
  .wrap{max-width:480px;margin:0 auto;padding:0 16px;}
  h1,h2,h3{font-family:var(--d);letter-spacing:-.01em;}

  .top{position:sticky;top:0;background:var(--bg);z-index:9;padding:14px 0 12px;border-bottom:1px solid var(--line);}
  .top-in{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .back{font-size:20px;color:var(--muted);cursor:pointer;}
  .top h1{font-size:18px;}.top .sub{font-size:12px;color:var(--muted);}
  .dots{display:flex;gap:6px;}
  .dots .d{flex:1;height:5px;border-radius:99px;background:var(--line);}
  .dots .d.on{background:var(--accent);}.dots .d.done{background:var(--accent);opacity:.5;}

  .step-h{margin:18px 0 4px;}
  .step-h .n{font-family:var(--d);font-weight:700;font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;}
  .step-h h2{font-size:22px;margin-top:5px;}
  .step-h p{font-size:13.5px;color:var(--muted);margin-top:3px;}

  label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 5px;font-weight:500;}
  input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:var(--b);background:var(--card);color:var(--ink);}
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  .row{display:flex;gap:10px;}.row>*{flex:1;}
  .opt-note{font-size:11.5px;color:var(--muted);}

  .utypes{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px;}
  .utype{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px;cursor:pointer;transition:.12s;position:relative;}
  .utype:hover{border-color:var(--accent);}
  .utype.sel{border-color:var(--accent);background:var(--soft);}
  .utype.sel::after{content:'✓';position:absolute;top:9px;right:11px;color:var(--accent);font-weight:700;}
  .utype .ty{font-family:var(--d);font-weight:700;font-size:15px;}
  .utype .pr{font-family:var(--d);font-weight:800;font-size:17px;color:var(--accent);margin-top:3px;}
  .utype .sh{font-size:11px;color:var(--muted);}

  .toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;}
  .toggle .lbl{font-size:14.5px;font-weight:600;font-family:var(--d);}
  .toggle .lbl small{display:block;font-size:12px;color:var(--muted);font-weight:400;font-family:var(--b);}
  .sw{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:.15s;flex-shrink:0;}
  .sw.on{background:var(--accent);}
  .sw::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s;}
  .sw.on::after{left:23px;}

  .mtotal{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:12px;padding:14px 16px;margin-top:12px;font-family:var(--d);font-weight:700;}
  .mtotal span:last-child{font-size:20px;font-weight:800;}
  .onetime-h{font-family:var(--d);font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:20px 0 4px;padding-top:14px;border-top:1px dashed var(--line);}

  .upload{display:flex;align-items:center;gap:12px;background:var(--card);border:1px dashed #bbb;border-radius:12px;padding:14px;cursor:pointer;margin-top:5px;}
  .upload .ic{font-size:22px;}.upload .tx{flex:1;}.upload .tx h3{font-size:14px;}.upload .tx small{color:var(--muted);font-size:12px;}
  .upload.done{border-style:solid;border-color:var(--accent);background:var(--soft);}
  .priv{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5;background:var(--warm);padding:10px 12px;border-radius:10px;}

  .rev{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px;}
  .rev .rr{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;}
  .rev .rr:last-child{border:none;}
  .rev .rr .k{color:var(--muted);}.rev .rr .v{font-weight:500;text-align:right;}
  .rev-h{font-family:var(--d);font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;margin:16px 0 7px;letter-spacing:.04em;}

  .bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px;z-index:9;}
  .bar-in{max-width:480px;margin:0 auto;display:flex;gap:10px;align-items:center;}
  .btn{font-family:var(--d);font-weight:700;font-size:15px;border:none;border-radius:11px;padding:14px;cursor:pointer;}
  .btn.next{background:var(--accent);color:#fff;flex:1;}
  .btn.back{background:var(--card);border:1px solid var(--line);color:var(--ink);flex:0 0 26%;}
  .btn.skip{background:none;color:var(--muted);font-weight:600;font-size:13px;border:none;}
  .savebar{text-align:center;margin-top:8px;}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const STEPS=['Tenant','Unit & rent','Documents','Review'];
let step=0;
const UTYPES=[
  {ty:'1 RK',sh:'Room + kitchen',rent:9000},
  {ty:'1 BHK',sh:'1 bed, hall, kitchen',rent:14000},
  {ty:'2 BHK',sh:'2 bed, hall, kitchen',rent:22000},
  {ty:'3 BHK',sh:'3 bed, hall, kitchen',rent:32000}
];
const d={
  name:'',phone:'',tenantType:'Family',occupants:'2',movein:'2026-06-23',
  utypeIdx:1,flat:'302',rent:14000,
  maintOn:false,maint:0,deposit:28000,
  idtype:'Aadhaar',idno:'',idUploaded:false,agreementUploaded:false,photoUploaded:false,verified:false,police:false
};
const $=id=>document.getElementById(id);
const money=n=>'₹'+(+n||0).toLocaleString('en-IN');
function set(f,v){d[f]=v;}
function utype(){return UTYPES[d.utypeIdx];}
function monthlyTotal(){return (+d.rent||0)+(d.maintOn?(+d.maint||0):0);}

function tenant(){
  return `<div class="step-h"><span class="n">Step 1 of 4</span><h2>Tenant details</h2><p>Who's renting the flat.</p></div>
  <label>Primary tenant name</label><input value="${d.name}" oninput="set('name',this.value);refreshNext()" placeholder="e.g. Rohan Desai">
  <label>Phone number</label><input value="${d.phone}" oninput="set('phone',this.value);refreshNext()" placeholder="10-digit mobile" inputmode="numeric">
  <div class="row">
    <div><label>Tenant type</label><select onchange="set('tenantType',this.value)">${['Family','Bachelor(s)','Company lease','Couple'].map(t=>`<option ${d.tenantType===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div><label>Occupants</label><input type="number" value="${d.occupants}" oninput="set('occupants',this.value)"></div>
  </div>
  <label>Move-in date</label><input type="date" value="${d.movein}" oninput="set('movein',this.value)">`;
}
function unitStep(){
  const cards=UTYPES.map((u,i)=>`<div class="utype ${d.utypeIdx===i?'sel':''}" onclick="pickUnit(${i})">
    <div class="ty">${u.ty}</div><div class="pr">${money(u.rent)}</div><div class="sh">${u.sh} · /mo</div></div>`).join('');
  return `<div class="step-h"><span class="n">Step 2 of 4</span><h2>Unit & rent</h2><p>Pick the flat type — it sets the rent.</p></div>
  <label>Flat type <span class="opt-note">(sets the rent)</span></label>
  <div class="utypes">${cards}</div>
  <div class="row" style="margin-top:12px">
    <div><label>Flat / unit no.</label><input value="${d.flat}" oninput="set('flat',this.value)"></div>
    <div><label>Monthly rent</label><input type="number" value="${d.rent}" oninput="set('rent',+this.value);updTotal()"></div>
  </div>
  <div class="opt-note" style="margin-top:5px">Rent auto-set by flat type; edit for a special rate.</div>
  <div class="toggle"><div class="lbl">Add maintenance charge<small>Society / upkeep, separate from rent</small></div><div class="sw ${d.maintOn?'on':''}" onclick="toggleMaint()"></div></div>
  ${d.maintOn?`<label>Maintenance (monthly)</label><input type="number" value="${d.maint}" oninput="set('maint',+this.value);updTotal()">`:''}
  <div class="mtotal"><span>Monthly total</span><span id="mtot">${money(monthlyTotal())}</span></div>
  <div class="onetime-h">One-time (at move-in)</div>
  <label>Security deposit</label><input type="number" value="${d.deposit}" oninput="set('deposit',+this.value)">
  <div class="opt-note" style="margin-top:5px">Utilities (electricity, water, gas) are usually the tenant's own — not added here. Deposit kept separate.</div>`;
}
function documents(){
  return `<div class="step-h"><span class="n">Step 3 of 4</span><h2>Documents & ID</h2><p>Agreement, ID and verification.</p></div>
  <div class="upload ${d.agreementUploaded?'done':''}" onclick="fakeUpload('agreementUploaded')"><span class="ic">${d.agreementUploaded?'✅':'📄'}</span><div class="tx"><h3>${d.agreementUploaded?'Agreement uploaded':'Rent agreement'}</h3><small>${d.agreementUploaded?'Saved to your Drive':'Signed lease / agreement'}</small></div></div>
  <div class="row">
    <div><label>ID type</label><select onchange="set('idtype',this.value)">${['Aadhaar','PAN','Passport','Driving licence'].map(t=>`<option ${d.idtype===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div><label>ID number</label><input value="${d.idno}" oninput="set('idno',this.value)" placeholder="Optional"></div>
  </div>
  <div class="upload ${d.idUploaded?'done':''}" onclick="fakeUpload('idUploaded')"><span class="ic">${d.idUploaded?'✅':'🪪'}</span><div class="tx"><h3>${d.idUploaded?'ID uploaded':'Upload ID'}</h3><small>${d.idUploaded?'Saved to your Drive':'Photo or scan'}</small></div></div>
  ${d.idtype==='Aadhaar'?`<div class="priv">🔒 Aadhaar is <b>not stored in our database</b> — only in your own Google Drive. We keep just a ✓ flag.</div>`:''}
  <div class="upload ${d.photoUploaded?'done':''}" onclick="fakeUpload('photoUploaded')"><span class="ic">${d.photoUploaded?'✅':'📷'}</span><div class="tx"><h3>${d.photoUploaded?'Photo added':'Tenant photo'}</h3><small>For records</small></div></div>
  <div class="toggle"><div class="lbl">Mark ID as verified<small>Checked the original</small></div><div class="sw ${d.verified?'on':''}" onclick="toggleSw('verified')"></div></div>
  <div class="toggle"><div class="lbl">Police verification done<small>Recommended for rentals</small></div><div class="sw ${d.police?'on':''}" onclick="toggleSw('police')"></div></div>`;
}
function review(){
  const chk=b=>b?'<span style="color:var(--accent)">✓</span>':'<span style="color:var(--muted)">—</span>';
  return `<div class="step-h"><span class="n">Step 4 of 4</span><h2>Review & add</h2><p>Quick check before saving.</p></div>
  <div class="rev-h">Tenant</div>
  <div class="rev">
    <div class="rr"><span class="k">Name</span><span class="v">${d.name||'—'}</span></div>
    <div class="rr"><span class="k">Phone</span><span class="v">${d.phone||'—'}</span></div>
    <div class="rr"><span class="k">Type</span><span class="v">${d.tenantType} · ${d.occupants} occupants</span></div>
    <div class="rr"><span class="k">Move-in</span><span class="v">${new Date(d.movein).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</span></div>
  </div>
  <div class="rev-h">Unit & rent</div>
  <div class="rev">
    <div class="rr"><span class="k">Flat</span><span class="v">${utype().ty} · ${d.flat}</span></div>
    <div class="rr"><span class="k">Rent</span><span class="v">${money(d.rent)}</span></div>
    ${d.maintOn?`<div class="rr"><span class="k">Maintenance</span><span class="v">${money(d.maint)}</span></div>`:''}
    <div class="rr"><span class="k" style="font-weight:700;color:var(--ink)">Monthly total</span><span class="v" style="font-weight:800;color:var(--accent)">${money(monthlyTotal())}</span></div>
    <div class="rr"><span class="k">Deposit (one-time)</span><span class="v">${money(d.deposit)}</span></div>
  </div>
  <div class="rev-h">Documents</div>
  <div class="rev">
    <div class="rr"><span class="k">Agreement</span><span class="v">${chk(d.agreementUploaded)}</span></div>
    <div class="rr"><span class="k">ID (${d.idtype})</span><span class="v">${chk(d.idUploaded)}</span></div>
    <div class="rr"><span class="k">Photo</span><span class="v">${chk(d.photoUploaded)}</span></div>
    <div class="rr"><span class="k">Verified</span><span class="v">${chk(d.verified)}</span></div>
    <div class="rr"><span class="k">Police verification</span><span class="v">${chk(d.police)}</span></div>
  </div>`;
}

function pickUnit(i){d.utypeIdx=i;d.rent=UTYPES[i].rent;render();}
function toggleMaint(){d.maintOn=!d.maintOn;if(!d.maintOn)d.maint=0;render();}
function updTotal(){const e=$('mtot');if(e)e.textContent=money(monthlyTotal());}
function fakeUpload(f){d[f]=true;render();}
function toggleSw(f){d[f]=!d[f];render();}
function refreshNext(){const b=document.querySelector('.btn.next');if(!b)return;const ok=step!==0||(d.name.trim()&&d.phone.trim());b.disabled=!ok;b.style.opacity=ok?'1':'.4';}

function render(){
  if(step==='done'){renderDone();return;}
  const body=[tenant,unitStep,documents,review][step]();
  const dots=STEPS.map((s,i)=>`<div class="d ${i===step?'on':i<step?'done':''}"></div>`).join('');
  const isLast=step===STEPS.length-1;
  const canNext=step!==0||(d.name.trim()&&d.phone.trim());
  $('app').innerHTML=`
  <div class="top"><div class="wrap">
    <div class="top-in"><span class="back" onclick="goBack()">←</span>
    <div><h1>Add tenant</h1><div class="sub">Green Valley Rentals · ${STEPS[step]}</div></div></div>
    <div class="dots">${dots}</div>
  </div></div>
  <div class="wrap">${body}</div>
  <div class="bar"><div class="bar-in">
    ${step>0?'<button class="btn back" onclick="prev()">←</button>':''}
    <button class="btn next" onclick="next()" ${canNext?'':'disabled style="opacity:.4"'}>${isLast?'✓ Add tenant':'Continue →'}</button>
  </div>
  ${!isLast&&step>0?'<div class="savebar"><button class="btn skip" onclick="finish(true)">Save now, add rest later</button></div>':''}
  </div>`;
}
function next(){if(step===0&&!(d.name.trim()&&d.phone.trim())){alert('Please enter name and phone to continue.');return;}if(step<STEPS.length-1){step++;render();window.scrollTo(0,0);}else finish(false);}
function prev(){if(step>0){step--;render();window.scrollTo(0,0);}}
function goBack(){if(step===0)alert('Back to Tenants list');else prev();}
function finish(early){step='done';d._early=early;renderDone();window.scrollTo(0,0);}
function firstPayment(){return monthlyTotal()+(+d.deposit||0);}
function renderDone(){
  const due=firstPayment();
  $('app').innerHTML=`<div class="wrap" style="text-align:center;padding-top:50px">
    <div style="font-size:50px">✅</div>
    <h2 style="font-size:25px;margin:14px 0 6px;font-family:var(--d)">${d.name||'Tenant'} added!</h2>
    <p style="color:var(--muted);font-size:15px;line-height:1.5">${utype().ty} · Flat ${d.flat} · ${money(monthlyTotal())}/mo${d._early?'<br><span style="font-size:13px">Basic info saved — add documents anytime.</span>':''}</p>
    <div style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:24px 0;text-align:left">
      <div style="font-family:var(--d);font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px">Due at move-in</div>
      <div style="display:flex;justify-content:space-between;font-size:14px;padding:4px 0;color:var(--muted)"><span>First month${d.maintOn?' (rent + maintenance)':''}</span><span>${money(monthlyTotal())}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:14px;padding:4px 0;color:var(--muted)"><span>Security deposit</span><span>${money(d.deposit)}</span></div>
      <div style="display:flex;justify-content:space-between;font-family:var(--d);font-weight:800;font-size:19px;border-top:1px solid var(--line);margin-top:6px;padding-top:9px"><span>Total</span><span>${money(due)}</span></div>
    </div>
    <button class="btn next" style="width:100%;margin-bottom:10px" onclick="collectAndBill()">💸 Collect payment & generate bill</button>
    <button class="btn back" style="width:100%;flex:none" onclick="alert('Skipped — you can bill anytime from their profile.')">Skip for now</button>
  </div>`;
}
function collectAndBill(){alert('Opens the bill generator, pre-filled:\n\nFirst month '+money(monthlyTotal())+'\n+ Deposit '+money(d.deposit)+'\n= '+money(firstPayment())+' due');}
render();
</script>
</body>
</html>
