<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Khaata PG V1 Master</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script><style>
:root{--canvas:#FDFCF8;--surface:#FFFFFF;--row:#F6F6F5;--line:#E6E0D7;--ink:#171716;--muted:#6B6B69;--alert:#C23E2E;--alert-tint:#FFE4DF;--pending:#FFF0C4;--pending-ink:#6E5200;--done:#DDF3E6;--done-ink:#1E7A4C;--info:#D7E1FE;--info-ink:#2B3A75;--act:#2B3A75;--act-text:#FFFFFF;--neutral:#EDEDEC;--neutral-ink:#6B6B69;--violet:#B898F4;--sky:#AFD8F0;--teal:#8FD3CA;--sand:#E2D3BC;--biz:#0F2C24;--biz-ink:#FBFBFA;--scrim:rgba(0,0,0,.34)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--canvas:#1B1B1A;--surface:#262625;--row:#232322;--line:#38383A;--ink:#FFFFFF;--muted:#9B9B98;--alert:#E8705C;--alert-tint:#3A2420;--pending:#3A3122;--pending-ink:#EBC36B;--done:#244232;--done-ink:#74C99A;--info:#252C42;--info-ink:#DCE4FF;--act:#C9D4FB;--act-text:#1A2140;--neutral:#2A2A29;--neutral-ink:#9B9B98;--violet:#3B2A6E;--sky:#0F4A66;--teal:#0E4D47;--sand:#4A3B26;--scrim:rgba(0,0,0,.6)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--canvas);color:var(--ink);font-family:Manrope,system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer}[hidden]{display:none!important}svg{width:18px;height:18px}.app{max-width:520px;margin:auto;padding:12px 16px 96px}.top{position:sticky;top:0;background:var(--canvas);z-index:5;display:flex;align-items:center;gap:10px;padding:4px 0 10px}.mark,.ib{display:grid;place-items:center;flex:none}.mark{width:40px;height:40px;border-radius:50%;background:var(--biz);color:var(--biz-ink);font-weight:800}.ib{width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px}.ttl{flex:1}.ttl b{display:block;font-size:16px}.ttl small{font-size:11px;color:var(--muted)}h1{font-size:26px;margin:12px 0 4px}.lead{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 16px}.grp{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:20px 4px 8px}.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:10px}.row{width:100%;min-height:58px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;display:flex;align-items:center;gap:12px;padding:11px 0}.row:last-child{border-bottom:0}.tile{width:40px;height:40px;border-radius:13px;background:var(--neutral);display:grid;place-items:center;flex:none}.grow{flex:1}.row strong{display:block;font-size:12px}.row small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.tag{border-radius:999px;padding:3px 8px;background:var(--neutral);color:var(--neutral-ink);font-size:10px;font-weight:800}.wait{background:var(--pending);color:var(--pending-ink)}.bad{background:var(--alert);color:var(--act-text)}.ok{background:var(--done);color:var(--done-ink)}.note{padding:11px 12px;border-radius:14px;background:var(--row);font-size:11px;line-height:1.45;color:var(--muted);margin-top:10px}.info{background:var(--info);color:var(--info-ink)}.alert{background:var(--alert-tint);color:var(--alert)}.metrics,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}.metric b{display:block;font-size:21px}.metric small{font-size:11px;color:var(--muted)}.dest{min-height:105px;border:0;border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}.dest small{display:block;font-size:10px;margin-top:3px}.violet{background:var(--violet)}.sky{background:var(--sky)}.teal{background:var(--teal)}.sand{background:var(--sand)}.btn{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0 14px;font-size:11px;font-weight:800}.primary{background:var(--act);color:var(--act-text);border-color:var(--act)}.wide{width:100%;margin-top:10px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:11px}.kv:last-child{border-bottom:0}.kv span{color:var(--muted)}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);height:72px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.nav button{border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav button.on{color:var(--act)}.fab{position:fixed;right:16px;bottom:58px;width:54px;height:54px;border-radius:50%;border:0;background:var(--act);color:var(--act-text);z-index:25}.menu{position:fixed;right:16px;bottom:118px;width:220px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px;z-index:24;display:none}.menu.on{display:block}.menu button{width:100%;min-height:44px;border:0;background:transparent;text-align:left}.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;opacity:0;pointer-events:none}.scrim.on{opacity:1;pointer-events:auto}.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 16px 24px;z-index:31;transition:.2s}.sheet.on{transform:translate(-50%,0)}.handle{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}.sh{display:flex;gap:10px}.sh h2{font-size:18px;margin:0}.sh p{font-size:11px;color:var(--muted);margin:3px 0}.close{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface)}
</style></head><body><main class="app" id="app"></main>
<div class="menu" id="menu"><button data-flow="add-tenant">Add tenant</button><button data-flow="record-payment">Record payment</button><button data-flow="add-expense">Add expense</button><button data-flow="add-charge">Add charge</button></div>
<button class="fab" id="fab" aria-label="Quick actions"><i data-lucide="plus"></i></button>
<nav class="nav" id="nav"><button data-nav="home"><i data-lucide="house"></i>Home</button><button data-nav="tenants"><i data-lucide="users"></i>Tenants</button><button data-nav="collections"><i data-lucide="indian-rupee"></i>Collections</button><button data-nav="more"><i data-lucide="menu"></i>More</button></nav>
<div class="scrim" id="scrim"></div><section class="sheet" id="sheet"><div class="handle"></div><div class="sh"><div class="grow"><h2 id="st"></h2><p id="ss"></p></div><button class="close" data-act="close"><i data-lucide="x"></i></button></div><div id="sb"></div></section><script>
(function(){"use strict";
var S={view:"home",stack:[]};
function I(n){return '<i data-lucide="'+n+'"></i>'}
function icons(){if(window.lucide)lucide.createIcons()}
function top(t,s,b){return '<header class="top">'+(b?'<button class="ib" data-act="back">'+I("arrow-left")+'</button>':'<div class="mark">S</div>')+'<div class="ttl"><b>'+t+'</b><small>'+s+'</small></div><button class="ib" data-act="theme">'+I("sun-moon")+'</button></header>'}
function R(i,t,s,a,g,c){return '<button class="row" data-act="'+a+'"><span class="tile">'+I(i)+'</span><span class="grow"><strong>'+t+'</strong><small>'+s+'</small></span>'+(g?'<span class="tag '+(c||"")+'">'+g+'</span>':"")+I("chevron-right")+'</button>'}
function home(){return top("Sunrise PG","Home",0)+'<div class="note info"><b>Integrated PG V1 master</b><br>Primary navigation, More, tenant operations, collection actions and key edge flows are connected in one file.</div><h1>Today</h1><p class="lead">Needs attention and a small business pulse.</p><div class="grp">Needs attention</div><section class="card">'+R("triangle-alert","Bed conflict · Room 203 / Bed B","Current and upcoming commitments overlap","bed","Urgent","bad")+R("badge-help","3 approvals waiting","Staff requests need a yes or no","approvals","3","wait")+R("user-round","Joining overdue · Neha Sharma","Still Upcoming; bed remains reserved","upcoming","Upcoming","wait")+R("hand-coins","Cash with staff · ₹24,650","Review custody and handover","cash","Review","wait")+'</section><div class="grp">Business pulse</div><div class="metrics"><div class="metric"><b>₹1.42L</b><small>Collected</small></div><div class="metric"><b>₹38.5K</b><small>Outstanding</small></div><div class="metric"><b>42 / 50</b><small>Occupied beds</small></div><div class="metric"><b>₹21.8K</b><small>Expenses</small></div></div>'}
function tenants(){return top("Tenants","Sunrise PG",0)+'<h1>Tenants</h1><p class="lead">Current, upcoming and former tenancy records.</p><section class="card">'+R("user-round","Rohan Mehta","Room 203 · Bed B · ₹3,500 due","rohan","Active","ok")+R("user-round","Neha Sharma","Room 204 · Bed A · Joining overdue","upcoming","Upcoming","wait")+R("user-round-check","Vikram Shah","Former · ₹2,000 outstanding","former","Former","")+'</section>'}
function tenant(n){return top(n,"Tenant detail",1)+'<section class="card"><div class="kv"><span>Room / bed</span><b>Room 203 · Bed B</b></div><div class="kv"><span>Status</span><b>Active</b></div><div class="kv"><span>Outstanding</span><b>₹3,500</b></div><div class="kv"><span>Security held</span><b>₹10,000</b></div></section><div class="btns"><button class="btn primary" data-flow="record-payment">Record payment</button><button class="btn" data-flow="statement">Statement</button><button class="btn" data-flow="promise">Promise</button></div><div class="grp">Tenancy</div><section class="card">'+R("repeat-2","Transfer room","Preserve occupancy history","transfer")+R("calendar-x","Plan move-out","Plan ≠ end tenancy","moveout")+R("log-out","Exit settlement","Final dues, security and close","exit")+'</section><div class="grp">Money</div><section class="card">'+R("badge-plus","Add charge","Separate from payment and rent","charge")+R("rotate-ccw","Payment correction","Original event remains","correction")+R("shield-check","Security & refund","Explicit application or refund","security")+R("scale","Charge resolution","Waive / write off / dispute","resolution")+'</section>'}
function collections(){return top("Collections","Sunrise PG",0)+'<h1>Collections</h1><p class="lead">Obligation-first collection state.</p><div class="metrics"><div class="metric"><b>₹1.42L</b><small>Collected</small></div><div class="metric"><b>₹38.5K</b><small>Outstanding</small></div></div><section class="card">'+R("circle-dollar-sign","Rohan Mehta · October rent","₹8,500 · ₹3,500 outstanding","col","Part paid","wait")+R("circle-dollar-sign","Sunita Das · October rent","₹7,500 · due 10 Oct","simple","Due","")+R("circle-check-big","Arjun Rao · October rent","₹9,000 · paid","simple","Paid","ok")+'</section>'}
function more(){return top("Sunrise PG","More",0)+'<h1>More</h1><p class="lead">Property controls, operating tools and business settings.</p><div class="grp">Setup & access</div><div class="grid"><button class="dest violet" data-sub="rooms">'+I("bed-double")+'<span><strong>Rooms & beds</strong><small>Capacity and availability</small></span></button><button class="dest sky" data-sub="staff">'+I("users")+'<span><strong>Staff & access</strong><small>Roles and approvals</small></span></button><button class="dest teal" data-sub="billing">'+I("receipt-indian-rupee")+'<span><strong>Billing settings</strong><small>Rent and due rules</small></span></button><button class="dest sand" data-sub="requirements">'+I("clipboard-check")+'<span><strong>Tenant requirements</strong><small>Required and optional details</small></span></button></div><div class="grp">Operations</div><section class="card">'+R("history","Tenancy History","Tenant, room and bed history","sub-history")+R("wallet-cards","Expenses","Categories and defaults","sub-expenses")+R("hand-coins","Cash & handover","Custody and accountability","cash")+'</section><div class="grp">Features & data</div><section class="card">'+R("blocks","Optional features","Electricity, food / mess and parking","sub-optional")+R("cloud-cog","Backup & Sync","Device only · Drive · Sync","sub-backup","Local","")+R("settings-2","Business settings","Name, currency and timezone","sub-business")+'</section>'}
function sub(k){var t={rooms:"Rooms & beds",staff:"Staff & access",billing:"Billing settings",requirements:"Tenant requirements",history:"Tenancy History",expenses:"Expense settings",optional:"Optional features",backup:"Backup & Sync",business:"Business settings"}[k],h=top(t,"Sunrise PG",1)+"<h1>"+t+"</h1>"; if(k==="rooms")h+='<p class="lead">Capacity, occupancy and lifecycle.</p><section class="card">'+R("bed-single","Room 203","3 beds · 2 occupied · 1 vacant","capacity")+R("bed-single","Room 204","2 beds · 1 upcoming","simple")+"</section>"; if(k==="staff")h+='<p class="lead">People, roles, permissions, approvals and visibility.</p><section class="card">'+R("user-round","Ravi Kumar","Manager · Active","simple")+R("user-round","Sunita Rao","Caretaker · Active","simple")+R("badge-help","Waiting for approval","3 requests","approvals","3","wait")+"</section>"; if(k==="billing")h+='<p class="lead">Monthly defaults.</p><section class="card"><div class="kv"><span>Frequency</span><b>Monthly</b></div><div class="kv"><span>Timing</span><b>Prepaid</b></div><div class="kv"><span>Due day</span><b>5th</b></div><div class="kv"><span>Grace</span><b>3 days</b></div></section>'; if(k==="requirements")h+='<p class="lead">Required · Optional · Not collected.</p><section class="card">'+R("phone","Phone number","Required","simple","Required","")+R("id-card","Identity document","Required","simple","Required","")+R("contact-round","Emergency contact","Optional","simple","Optional","")+"</section>"; if(k==="history")h+='<p class="lead">Historical occupancy by tenant, room or bed.</p><section class="card">'+R("history","Rohan Mehta","Room 203 · Bed B · Active","simple")+R("history","Vikram Shah","Room 118 · Bed A · ended 2 Oct","simple")+"</section>"; if(k==="expenses")h+='<p class="lead">Ready with defaults.</p><section class="card"><div class="kv"><span>Categories</span><b>Utilities · Repairs · Supplies · Staff</b></div><div class="kv"><span>Source</span><b>Business or staff-paid</b></div><div class="kv"><span>Proof</span><b>Optional</b></div></section>'; if(k==="optional")h+='<p class="lead">Hidden until enabled.</p><section class="card">'+R("zap","Electricity","Not managed in Khaata","simple")+R("utensils","Food / mess","Not offered","simple")+R("car","Parking","Not offered · no slot inventory","simple")+"</section>"; if(k==="backup")h+='<p class="lead">Core work stays local-first.</p><section class="card">'+R("smartphone","On this device only","Current","simple","Selected","ok")+R("cloud-upload","Google Drive backup","Backup and restore","simple")+R("cloud","Khaata Sync","Local + server sync","simple","Pro","")+"</section>"; if(k==="business")h+='<p class="lead">Business identity and operating context.</p><section class="card"><div class="kv"><span>Name</span><b>Sunrise PG</b></div><div class="kv"><span>Currency</span><b>INR</b></div><div class="kv"><span>Timezone</span><b>Asia/Kolkata</b></div></section>'; return h}
function render(){var h=S.view==="home"?home():S.view==="tenants"?tenants():S.view==="collections"?collections():S.view==="more"?more():S.view.indexOf("tenant:")===0?tenant(S.view.slice(7)):sub(S.view.slice(4));app.innerHTML=h;nav.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.dataset.nav===S.view)});fab.hidden=S.view.indexOf("sub:")===0||S.view.indexOf("tenant:")===0;icons()}
function push(v){S.stack.push(S.view);S.view=v;render();scrollTo(0,0)}function back(){S.view=S.stack.length?S.stack.pop():"home";render();scrollTo(0,0)}
function open(t,s,b){st.textContent=t;ss.textContent=s||"";sb.innerHTML=b;scrim.classList.add("on");sheet.classList.add("on");icons()}function close(){scrim.classList.remove("on");sheet.classList.remove("on")}
function flow(n){var m={"add-tenant":["Add tenant","Basics → Room / Bed → Money → Requirements → Review",'<div class="note info">Creates the real tenant/tenancy record.</div><button class="btn primary wide">Start onboarding</button>'],"record-payment":["Record payment","A real financial event",'<div class="kv"><span>Outstanding</span><b>₹3,500</b></div><button class="btn primary wide">Continue</button>'],"add-expense":["Add expense","Business-paid or staff-paid",'<button class="btn primary wide">Record expense</button>'],"add-charge":["Add charge","Separate from rent and payment",'<button class="btn primary wide">Add charge</button>'],"statement":["Tenant statement","Running financial statement",'<div class="kv"><span>October rent</span><b>₹8,500</b></div><div class="kv"><span>Paid</span><b>₹5,000</b></div><div class="kv"><span>Outstanding</span><b>₹3,500</b></div>'],"promise":["Record promise","No ledger effect",'<button class="btn primary wide">Record promise</button>']};var x=m[n];if(x)open(x[0],x[1],x[2])}
document.addEventListener("click",function(e){var n=e.target.closest("[data-nav]");if(n){S.stack=[];S.view=n.dataset.nav;render();return}if(e.target.closest("#fab")){menu.classList.toggle("on");return}var f=e.target.closest("[data-flow]");if(f){menu.classList.remove("on");flow(f.dataset.flow);return}var su=e.target.closest("[data-sub]");if(su){push("sub:"+su.dataset.sub);return}var a=e.target.closest("[data-act]");if(!a)return;var x=a.dataset.act;if(x==="theme"){var r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark";return}if(x==="back"){back();return}if(x==="close"){close();return}if(x==="rohan"){push("tenant:Rohan Mehta");return}if(x.indexOf("sub-")===0){push("sub:"+x.slice(4));return}if(x==="cash")open("Cash & handover","Custody and accountability",'<div class="kv"><span>Sunita Rao</span><b>₹18,400</b></div><div class="kv"><span>Ravi Kumar</span><b>₹6,250</b></div><div class="note info">Tenant payments are already settled; this tracks physical custody.</div>');else if(x==="approvals")open("Waiting for approval","Request ≠ execution",'<div class="note">3 staff requests are waiting.</div>');else if(x==="upcoming")open("Upcoming tenant","Joining overdue",'<div class="note">Still Upcoming; no auto-activation or bed release.</div><button class="btn primary wide">Confirm joined</button><button class="btn wide">Change joining date</button>');else if(x==="former")open("Former tenant follow-up","Former does not mean settled",'<div class="kv"><span>Outstanding</span><b>₹2,000</b></div><div class="kv"><span>Refund</span><b>₹4,000 pending</b></div>');else if(x==="bed")open("Bed conflict","No automatic reassignment",'<div class="note alert">Two legitimate commitments overlap.</div><button class="btn wide">Change upcoming room / bed</button>');else if(x==="capacity")open("Capacity availability","History-preserving lifecycle",'<div class="btns"><button class="btn primary">Available</button><button class="btn">Temporarily unavailable</button><button class="btn">Retired</button></div>');else if(x==="col")open("Rohan Mehta","October obligation",'<div class="kv"><span>Due</span><b>₹8,500</b></div><div class="kv"><span>Paid</span><b>₹5,000</b></div><div class="kv"><span>Outstanding</span><b>₹3,500</b></div><button class="btn primary wide" data-flow="record-payment">Record payment</button><button class="btn wide" data-flow="statement">View statement</button><button class="btn wide" data-flow="promise">Record promise</button>');else if(x==="transfer")open("Room transfer","Preserve occupancy history",'<div class="note info">Room movement does not automatically change rent.</div>');else if(x==="moveout")open("Plan move-out","Plan ≠ end tenancy",'<div class="note">Creates planned vacancy without ending tenancy.</div>');else if(x==="exit")open("Exit settlement","Vacate → settle → former",'<div class="kv"><span>Outstanding</span><b>₹3,500</b></div><div class="kv"><span>Security held</span><b>₹10,000</b></div><div class="note alert">Security is never silently applied to dues.</div>');else if(x==="charge")flow("add-charge");else if(x==="correction")open("Payment correction","Original event remains",'<div class="note info">Create a new correction/reversal event.</div>');else if(x==="security")open("Security & refund","Explicit action required",'<button class="btn wide">Apply security to dues</button><button class="btn primary wide">Record refund</button>');else if(x==="resolution")open("Charge resolution","Keep history intact",'<div class="btns"><button class="btn">Keep due</button><button class="btn">Waive</button><button class="btn">Write off</button><button class="btn">Dispute</button></div>');else open("Prototype action","Integrated navigation works",'<div class="note info">The dedicated detailed prototype carries the full form.</div>')});
scrim.addEventListener("click",function(){close();menu.classList.remove("on")});render()})();
</script></body></html>
