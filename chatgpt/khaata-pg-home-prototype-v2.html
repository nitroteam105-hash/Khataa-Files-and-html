<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Khaata · Sunrise PG</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FDFCF8;--surface:#F5F4EF;--surface2:#EFEEE9;--ink:#222;--ink2:#6B6B69;--line:#E4E2DA;--pri:#222;--pri-ink:#fff;--alert:#FF6B5B;--alert-ink:#B83A2B;--alert-tint:#FFE4DF;--pending:#FFF0C4;--pending-ink:#6E5200;--info:#D7E1FE;--info-ink:#2B3A75;--navy:#2B3A75;--on-navy:#fff;--r:24px;--rb:14px;--scrim:rgba(0,0,0,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1B1B1A;--surface:#262625;--surface2:#2C2C2B;--ink:#fff;--ink2:#ADABA6;--line:#353533;--pri:#fff;--pri-ink:#1B1B1A;--alert-ink:#F59384;--alert-tint:rgba(240,122,104,.16);--pending:#3A3122;--pending-ink:#EBC36B;--info:#252C42;--info-ink:#DCE4FF;--navy:#C9D4FB;--on-navy:#1A2140;--scrim:rgba(0,0,0,.6)}}
:root[data-theme=dark]{--bg:#1B1B1A;--surface:#262625;--surface2:#2C2C2B;--ink:#fff;--ink2:#ADABA6;--line:#353533;--pri:#fff;--pri-ink:#1B1B1A;--alert-ink:#F59384;--alert-tint:rgba(240,122,104,.16);--pending:#3A3122;--pending-ink:#EBC36B;--info:#252C42;--info-ink:#DCE4FF;--navy:#C9D4FB;--on-navy:#1A2140;--scrim:rgba(0,0,0,.6)}
*,*:before,*:after{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}.wrap{max-width:520px;margin:auto;padding:0 16px 104px}button{font:inherit;color:inherit;cursor:pointer}.top{padding:18px 0 8px;display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:14px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-weight:800}.biz{flex:1;text-align:left;background:none;border:0;padding:0}.biz b{display:block;font-size:16px}.biz span{display:block;color:var(--ink2);font-size:12.5px;margin-top:1px}.round{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;place-items:center}
.greet{padding:16px 0 8px}.greet h1{font-size:26px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.025em}.greet p{margin:5px 0 0;color:var(--ink2);font-size:13.5px}
.sec{margin-top:26px}.sh{display:flex;align-items:baseline;margin-bottom:8px}.sh h2{font-size:17px;margin:0;font-weight:800}.sh button{margin-left:auto;border:0;background:none;color:var(--ink);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.list{border-top:1px solid var(--line)}.row{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:13px 0;display:flex;gap:12px;align-items:flex-start}.tile{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:800;font-size:14px}.tile.bad{background:var(--alert-tint);color:var(--alert-ink)}.tile.wait{background:var(--pending);color:var(--pending-ink)}.tile.neu{background:var(--surface2);color:var(--ink2)}.grow{flex:1;min-width:0}.row b{display:block;font-size:14px;font-weight:700;line-height:1.35}.row small{display:block;color:var(--ink2);font-size:12.5px;line-height:1.45;margin-top:3px}.chev{color:var(--ink2);padding-top:9px}.date{width:62px;flex:none;color:var(--ink2);font-size:12px;font-weight:700;padding-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}.pulse{display:grid;grid-template-columns:1fr 1fr;gap:0}.metric{border:0;background:none;text-align:left;padding:4px 0 14px}.metric:nth-child(odd){padding-right:16px}.metric:nth-child(even){padding-left:16px;border-left:1px solid var(--line)}.metric:nth-child(n+3){padding-top:14px;padding-bottom:3px;border-top:1px solid var(--line)}.metric strong{display:block;font-size:22px;letter-spacing:-.03em}.metric span{font-size:12px;color:var(--ink2);font-weight:600}.footnote{font-size:11.5px;color:var(--ink2);margin:8px 2px 0}
.caught{padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.caught b{font-size:14px}.caught span{display:block;color:var(--ink2);font-size:12.5px;margin-top:3px}
.bar{position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 20px),500px);height:64px;background:var(--surface);border:1px solid var(--line);border-radius:20px;display:flex;align-items:center;justify-content:space-around;z-index:5}.nav{width:68px;border:0;background:none;color:var(--ink2);font-size:10.5px;font-weight:700;display:grid;gap:3px;place-items:center}.nav.on{color:var(--ink)}.nav i{font-style:normal;font-size:17px}.gap{width:56px}.fab{position:fixed;left:50%;bottom:47px;transform:translateX(-50%);width:52px;height:52px;border:0;border-radius:50%;background:var(--navy);color:var(--on-navy);font-size:26px;z-index:7}.sheet{display:none;position:fixed;z-index:9;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);background:var(--surface);border-radius:22px 22px 0 0;padding:12px 18px calc(20px + env(safe-area-inset-bottom));}.sheet.on{display:block}.sheet:before{content:"";display:block;width:42px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}.sheet h3{font-size:17px;margin:0 0 8px}.sheet button{width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:13px 0;font-weight:600}.scrim{display:none;position:fixed;inset:0;background:var(--scrim);z-index:8}.scrim.on{display:block}.proto{margin-top:26px;border-top:1px dashed var(--line);padding-top:10px}.proto button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 10px;font-size:11px}
</style></head><body><main class="wrap">
<header class="top"><div class="mark">S</div><button class="biz" data-act="business"><b>Sunrise PG</b><span>PG / Hostel · Bengaluru ▾</span></button><button class="round" data-act="more">•••</button></header>
<section class="greet"><h1>Good evening</h1><p>Sunday, 4 October</p></section>
<section class="sec"><div class="sh"><h2>Needs attention</h2><button data-act="see">See all</button></div><div id="attention"></div></section>
<section class="sec"><div class="sh"><h2>Coming up</h2></div><div class="list">

<script>(function(){var S={caught:false,theme:""};function attention(){var e=document.getElementById("attention");if(S.caught){e.innerHTML='<div class="caught"><b>You’re caught up</b><span>Nothing needs your attention right now.</span></div>';return}e.innerHTML='<div class="list"><button class="row" data-act="item"><span class="tile bad">₹</span><span class="grow"><b>Rajesh · ₹12,000 overdue</b><small>2 months · Exceeds security by ₹2,000</small></span><span class="chev">›</span></button><button class="row" data-act="item"><span class="tile bad">!</span><span class="grow"><b>Room 101-A has a conflict</b><small>Rajesh until 5 Dec · Priya from 1 Dec</small></span><span class="chev">›</span></button><button class="row" data-act="item"><span class="tile wait">2</span><span class="grow"><b>Approvals waiting</b><small>Rent discount · Expense</small></span><span class="chev">›</span></button></div>'}attention();document.addEventListener("click",function(e){var b=e.target.closest("[data-act]");if(!b)return;var a=b.getAttribute("data-act");if(a==="add"){document.getElementById("scrim").className="scrim on";document.getElementById("sheet").className="sheet on"}if(a==="close"||a==="action"){document.getElementById("scrim").className="scrim";document.getElementById("sheet").className="sheet"}if(a==="caught"){S.caught=!S.caught;attention()}if(a==="theme"){S.theme=S.theme==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",S.theme)}});document.addEventListener("input",function(){});document.addEventListener("change",function(){})}());</script></body></html>
