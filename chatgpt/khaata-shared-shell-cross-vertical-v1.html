<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Khaata · Shared shell · Cross-vertical v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
:root{
--canvas:#FDFCF8;--surface:#FFFFFF;--row:#F6F6F5;--line:#E6E0D7;--ink:#171716;--muted:#6B6B69;
--alert:#FF6B5B;--alert-solid:#C23E2E;--alert-ink:#B83A2B;--alert-tint:#FFE4DF;
--pending:#EBC36B;--pending-ink:#6E5200;--pending-tile:#FFF0C4;
--done-ink:#1E7A4C;--done-tint:#DDF3E6;--info:#D7E1FE;--info-ink:#2B3A75;--info-line:#C3D0F7;
--act:#2B3A75;--act-text:#FFFFFF;--neutral-tile:#EDEDEC;--neutral-ink:#6B6B69;
--idb-violet:#B898F4;--idb-lavender:#C9C3EE;--idb-blue:#9AB8F0;--idb-sky:#AFD8F0;--idb-teal:#8FD3CA;--idb-magenta:#E3A9D5;--idb-sand:#E2D3BC;
--idh-violet:#3B2A6E;--idh-lavender:#36305E;--idh-blue:#163A78;--idh-sky:#0F4A66;--idh-teal:#0E4D47;--idh-magenta:#5A1E4E;--idh-sand:#4A3B26;--idh-ink:#FBFBFA;
--biz-pink:#FBB9C2;--biz-pink-ink:#171716;--biz-fig:#3B1F3A;--biz-fig-ink:#FBFBFA;--biz-crimson:#D42E57;--biz-crimson-ink:#FBFBFA;--biz-pine:#0F2C24;--biz-pine-ink:#FBFBFA;--biz-olive:#292E1E;--biz-olive-ink:#FBFBFA;--biz-navy:#1E2A5A;--biz-navy-ink:#FBFBFA;
--scrim:rgba(0,0,0,.34);--r-card:20px;--r-btn:14px;--r-pill:999px;color-scheme:light
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
--canvas:#1B1B1A;--surface:#262625;--row:#232322;--line:#38383A;--ink:#FFFFFF;--muted:#9B9B98;
--alert:#E8705C;--alert-solid:#E8705C;--alert-ink:#F59384;--alert-tint:#3A2420;
--pending:#EBC36B;--pending-ink:#EBC36B;--pending-tile:#3A3122;--done-ink:#74C99A;--done-tint:#244232;
--info:#252C42;--info-ink:#DCE4FF;--info-line:#34405E;--act:#C9D4FB;--act-text:#1A2140;--neutral-tile:#2A2A29;--neutral-ink:#9B9B98;
--idb-violet:#3B2A6E;--idb-lavender:#36305E;--idb-blue:#163A78;--idb-sky:#0F4A66;--idb-teal:#0E4D47;--idb-magenta:#5A1E4E;--idb-sand:#4A3B26;
--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
--canvas:#1B1B1A;--surface:#262625;--row:#232322;--line:#38383A;--ink:#FFFFFF;--muted:#9B9B98;
--alert:#E8705C;--alert-solid:#E8705C;--alert-ink:#F59384;--alert-tint:#3A2420;
--pending:#EBC36B;--pending-ink:#EBC36B;--pending-tile:#3A3122;--done-ink:#74C99A;--done-tint:#244232;
--info:#252C42;--info-ink:#DCE4FF;--info-line:#34405E;--act:#C9D4FB;--act-text:#1A2140;--neutral-tile:#2A2A29;--neutral-ink:#9B9B98;
--idb-violet:#3B2A6E;--idb-lavender:#36305E;--idb-blue:#163A78;--idb-sky:#0F4A66;--idb-teal:#0E4D47;--idb-magenta:#5A1E4E;--idb-sand:#4A3B26;
--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--act);outline-offset:2px}[hidden]{display:none!important}
svg.lucide{width:18px;height:18px;flex:none}
.app{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:8;background:var(--canvas);display:flex;align-items:center;gap:10px;padding:2px 0 10px}
.bizbutton{flex:1;min-width:0;border:0;background:transparent;padding:0;display:flex;align-items:center;gap:10px;text-align:left}
.mark{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.mark.pine{background:var(--biz-pine);color:var(--biz-pine-ink)}.mark.fig{background:var(--biz-fig);color:var(--biz-fig-ink)}.mark.crimson{background:var(--biz-crimson);color:var(--biz-crimson-ink)}.mark.olive{background:var(--biz-olive);color:var(--biz-olive-ink)}.mark.navy{background:var(--biz-navy);color:var(--biz-navy-ink)}.mark.pink{background:var(--biz-pink);color:var(--biz-pink-ink)}
.biztext{min-width:0}.biztext strong{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.biztext small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.ibtn{width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;display:grid;place-items:center;padding:0}
h1{font-size:26px;line-height:1.08;margin:12px 0 5px}.lead{font-size:12px;line-height:1.5;color:var(--muted);margin:0 0 16px}
.note{border-radius:14px;padding:11px 12px;font-size:11px;line-height:1.45;background:var(--info);color:var(--info-ink);margin-bottom:14px}
.grp{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:21px 4px 8px}
.hub{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mod{min-height:118px;border:0;border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;color:#171716}
.mod i{width:20px;height:20px}.mod strong{display:block;font-size:13px}.mod small{display:block;font-size:10.5px;margin-top:3px;opacity:.75}
.mod.sand{background:var(--idb-sand)}.mod.magenta{background:var(--idb-magenta)}.mod.violet{background:var(--idb-violet)}.mod.blue{background:var(--idb-blue)}.mod.teal{background:var(--idb-teal)}.mod.lavender{background:var(--idb-lavender)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:14px;margin-top:10px}
.row{display:flex;align-items:center;gap:12px;min-height:58px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.grow{flex:1;min-width:0}
.row strong{display:block;font-size:12px}.row small{display:block;color:var(--muted);font-size:11px;line-height:1.4;margin-top:3px}.amount{font-weight:800;font-size:11px}
.tile{width:40px;height:40px;border-radius:13px;background:var(--neutral-tile);display:grid;place-items:center;flex:none}
.btn{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-btn);padding:0 14px;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.primary{background:var(--act);color:var(--act-text);border-color:var(--act)}.btn.wide{width:100%;margin-top:10px}
.inside-head{margin:0 -16px 14px;padding:calc(14px + env(safe-area-inset-top)) 16px 18px;color:var(--idh-ink);display:flex;align-items:center;gap:10px}.inside-head .back{width:44px;height:44px;border:1px solid rgba(255,255,255,.28);background:transparent;color:inherit;border-radius:12px;display:grid;place-items:center}.inside-head .grow{flex:1}.inside-head strong{font-size:18px;display:block}.inside-head small{font-size:11px;opacity:.8}
.inside-head.sand{background:var(--idh-sand)}.inside-head.magenta{background:var(--idh-magenta)}.inside-head.violet{background:var(--idh-violet)}.inside-head.blue{background:var(--idh-blue)}.inside-head.teal{background:var(--idh-teal)}.inside-head.lavender{background:var(--idh-lavender)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:.2s}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(340px,86vw);background:var(--canvas);border-left:1px solid var(--line);transform:translateX(105%);transition:.22s;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 0 env(safe-area-inset-bottom)}.drawer.on{transform:none}
.dhead{display:flex;align-items:flex-start;gap:10px;padding:0 16px 14px}.dhead .grow{flex:1}.dhead strong{font-size:17px;display:block}.dhead small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.dlist{padding:0 16px;overflow:auto}.drow{width:100%;min-height:58px;border:0;border-bottom:1px solid var(--line);background:transparent;display:flex;align-items:center;gap:10px;text-align:left}.drow:last-child{border-bottom:0}.drow .grow strong{font-size:12px}.drow .grow small{font-size:11px;color:var(--muted)}
.drawer-foot{margin-top:auto;padding:12px 16px}.switcher-title{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:4px 0 8px}
</style>
</head>
<body>
<main class="app" id="app"></main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Business switcher">
  <div class="dhead">
    <div class="grow"><strong>My businesses</strong><small>Switch without leaving Khaata</small></div>
    <button class="ibtn" id="closeDrawer" aria-label="Close"><i data-lucide="x"></i></button>
  </div>
  <div class="dlist" id="businessList"></div>
  <div class="drawer-foot">
    <button class="btn wide" id="addBusiness"><i data-lucide="plus"></i>Add business</button>
  </div>
</aside>

<script>
(function(){
"use strict";
var businesses=[
 {id:"pg",name:"Sunrise PG",type:"PG / hostel",mark:"S",color:"pine"},
 {id:"cafe",name:"Fig & Flour",type:"Bakery café",mark:"F",color:"fig"},
 {id:"juice",name:"Fresh Squeeze",type:"Juice bar",mark:"F",color:"crimson"},
 {id:"dairy",name:"Sharma Dairy",type:"Dairy delivery",mark:"S",color:"olive"},
 {id:"gym",name:"Iron Temple",type:"Gym",mark:"I",color:"navy"},
 {id:"ice",name:"Scoops & Co",type:"Ice cream parlour",mark:"S",color:"pink"}
];
var S={business:"pg",view:"hub",module:null};
var modules=[
 {id:"collections",name:"Collections",sub:"Money coming in",c:"sand",icon:"wallet",
  rows:[["receipt-text","October rent","₹1,42,000"],["clock","3 pending","this week"],["check-check","Settled","42 this month"]]},
 {id:"expenses",name:"Expenses",sub:"Money going out",c:"magenta",icon:"receipt",
  rows:[["zap","Electricity","₹8,400"],["wrench","Repairs","₹3,150"],["plus","Add expense",""]]},
 {id:"staff",name:"Staff",sub:"People & access",c:"violet",icon:"users",
  rows:[["user","Ramesh","Can edit"],["user","Sunita","View only"],["shield-check","Access & permissions",""]]},
 {id:"business",name:"Business",sub:"This business",c:"blue",icon:"building-2",
  rows:[["pencil","Name & details",""],["image","Logo & bill theme",""],["id-card","Tax & export",""]]},
 {id:"backup",name:"Backup",sub:"Data & restore",c:"teal",icon:"hard-drive",
  rows:[["cloud-upload","Back up now","2 min ago"],["history","Restore",""],["file-down","Export",""]]},
 {id:"settings",name:"Settings",sub:"App preferences",c:"lavender",icon:"settings-2",
  rows:[["palette","Appearance",""],["bell","Reminders",""],["globe","Language","English"]]}
];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function I(n){return '<i data-lucide="'+n+'"></i>'}
function icons(){if(window.lucide&&lucide.createIcons)lucide.createIcons()}
function biz(){return businesses.find(function(b){return b.id===S.business})||businesses[0]}
function mark(b,sz){return '<span class="mark '+b.color+'" style="width:'+sz+'px;height:'+sz+'px">'+esc(b.mark)+'</span>'}
function top(){
 var b=biz();
 return '<header class="top"><button class="bizbutton" data-act="drawer">'+mark(b,40)+'<span class="biztext"><strong>'+esc(b.name)+'</strong><small>'+esc(b.type)+'</small></span>'+I("chevron-down")+'</button><button class="ibtn" data-act="theme" aria-label="Toggle theme">'+I("sun-moon")+'</button></header>'
}
function hub(){
 return top()+
 '<div class="note"><b>Shared shell v1</b><br>Cross-vertical business switcher and fixed Khaata hub. Identity colour tells you where you are; status colours keep their operational meaning.</div>'+
 '<h1>Business hub</h1><p class="lead">The screens every business keeps, whatever its vertical.</p>'+
 '<div class="hub">'+modules.map(function(m){return '<button class="mod '+m.c+'" data-module="'+m.id+'"><span>'+I(m.icon)+'</span><span><strong>'+m.name+'</strong><small>'+m.sub+'</small></span></button>'}).join("")+'</div>'+
 '<div class="grp">Vertical workspace</div><section class="card"><div class="row"><span class="tile">'+I("bed-double")+'</span><span class="grow"><strong>PG / Hostel workspace</strong><small>Home · Tenants · Collections · More</small></span><button class="btn" data-act="vertical">Open</button></div></section>'+
 '<div class="grp">Account</div><section class="card"><div class="row"><span class="tile">'+I("sparkles")+'</span><span class="grow"><strong>Plan</strong><small>Premium · staff access enabled</small></span></div><div class="row"><span class="tile">'+I("life-buoy")+'</span><span class="grow"><strong>Help & support</strong><small>Khaata help</small></span></div></section>'
}
function inside(m){
 return '<div class="inside-head '+m.c+'"><button class="back" data-act="hub-back">'+I("arrow-left")+'</button><div class="grow"><small>You are in</small><strong>'+esc(m.name)+'</strong></div>'+I(m.icon)+'</div>'+
 '<p class="lead">'+esc(m.sub)+'. The identity colour stays in the header; operational rows below stay neutral.</p>'+
 '<section class="card">'+m.rows.map(function(r){return '<div class="row"><span class="tile">'+I(r[0])+'</span><span class="grow"><strong>'+esc(r[1])+'</strong><small>'+esc(r[2]||"")+'</small></span>'+(r[2]&&r[2].indexOf("₹")===0?'<span class="amount">'+esc(r[2])+'</span>':'')+I("chevron-right")+'</div>'}).join("")+'</section>'+
 (m.id==="settings"?'<div class="grp">Settings groups</div><section class="card"><div class="row"><span class="grow"><strong>On this device</strong><small>Backup & restore · App lock</small></span></div><div class="row"><span class="grow"><strong>Synced · Pro</strong><small>Cloud sync · Devices</small></span></div><div class="row"><span class="grow"><strong>General</strong><small>Appearance · Language</small></span></div></section>':'')
}
function render(){
 app.innerHTML=S.view==="hub"?hub():inside(modules.find(function(m){return m.id===S.module}));
 icons();
}
function renderDrawer(){
 businessList.innerHTML='<div class="switcher-title">My businesses</div>'+businesses.map(function(b){return '<button class="drow" data-business="'+b.id+'">'+mark(b,34)+'<span class="grow"><strong>'+esc(b.name)+'</strong><small>'+esc(b.type)+'</small></span>'+(b.id===S.business?I("check"):"")+'</button>'}).join("");
 icons()
}
function openDrawer(){renderDrawer();scrim.classList.add("on");drawer.classList.add("on")}
function closeDrawer(){scrim.classList.remove("on");drawer.classList.remove("on")}
document.addEventListener("click",function(e){
 var mod=e.target.closest("[data-module]");if(mod){S.module=mod.dataset.module;S.view="inside";render();window.scrollTo(0,0);return}
 var b=e.target.closest("[data-business]");if(b){S.business=b.dataset.business;closeDrawer();S.view="hub";S.module=null;render();return}
 var a=e.target.closest("[data-act]");if(!a)return;
 if(a.dataset.act==="drawer"){openDrawer();return}
 if(a.dataset.act==="theme"){var r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark";return}
 if(a.dataset.act==="hub-back"){S.view="hub";S.module=null;render();window.scrollTo(0,0);return}
 if(a.dataset.act==="vertical"){alert("Opens the current business vertical workspace.");return}
});
scrim.addEventListener("click",closeDrawer);
closeDrawer.addEventListener("click",closeDrawer);
addBusiness.addEventListener("click",function(){alert("Add business flow opens here.");});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDrawer()});
render();
})();
</script>
</body>
</html>
