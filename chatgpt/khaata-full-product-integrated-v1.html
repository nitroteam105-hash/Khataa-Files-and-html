var current="shared";
var frame=document.getElementById("frame");
var mode=document.getElementById("mode");
function decode64(s){
  var bin=atob(s), bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function load(which){
  current=which;
  frame.srcdoc=decode64(docs[which]);
  mode.textContent=which==="shared"?"Shared":"PG";
  mode.setAttribute("aria-label",which==="shared"?"Currently shared Khaata. Switch to PG workspace":"Currently PG workspace. Switch to shared Khaata");
}
window.addEventListener("message",function(e){
  if(e.data&&e.data.type==="khaata:navigate"&&docs[e.data.to])load(e.data.to);
});
mode.addEventListener("click",function(){load(current==="shared"?"pg":"shared")});
load("shared");
})();
