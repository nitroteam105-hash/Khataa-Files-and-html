<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khaata — Record Payment V1</title><style>
:root{--bg:#fdfcf8;--card:#fff;--ink:#191918;--muted:#74736f;--line:#e7e2d9;--act:#29396f;--red:#b64638}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,sans-serif}.app{max-width:520px;margin:auto;padding:22px 16px 94px}
.back{border:0;background:none;font-size:24px;padding:0;margin-bottom:20px;color:var(--ink)}h1{font-size:27px;margin:0 0 5px}.sub{font-size:12px;color:var(--muted);margin-bottom:24px}
.card{border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}.row{padding:14px;display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row span{color:var(--muted);font-size:12px}.row b{text-align:right;font-size:13px}
.actions{display:grid;gap:9px;margin-top:18px}.actions button{height:47px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:750;color:var(--ink)}.actions button:first-child{background:var(--act);border-color:var(--act);color:#fff}
.note{margin-top:20px;font-size:11px;line-height:1.5;color:var(--muted)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:62px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:none;color:var(--muted);font-size:11px}
</style></head>
<body><main class="app"><button class="back" onclick="history.back()">‹</button><h1>Record Payment</h1><div class="sub">Rohan Mehta · Room 203 · Bed B</div><section class="card"><div class="row"><span>Outstanding</span><b>₹4,500</b></div><div class="row"><span>Payment amount</span><b>₹4,500</b></div><div class="row"><span>Apply to</span><b>October rent</b></div><div class="row"><span>Payment mode</span><b>UPI</b></div><div class="row"><span>Received by</span><b>Owner</b></div></section><div class="actions"><button>Save payment</button><button>Save &amp; receipt</button></div><a href="receipt-detail.html" style="display:block;margin-top:10px;color:var(--act);font-weight:700;text-decoration:none">Receipt example →</a><a href="tenant-statement.html" style="display:block;margin-top:10px;color:var(--act);font-weight:700;text-decoration:none">Tenant statement →</a><p class="note">One payment can later be allocated across obligations. This V1 keeps the primary path obvious.</p></main><nav class="nav"><button>Home</button><button>Tenants</button><button>Collections</button><button>More</button></nav></body></html>
