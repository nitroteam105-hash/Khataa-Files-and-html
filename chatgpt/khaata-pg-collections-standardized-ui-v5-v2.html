<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Khaata · Collections</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script><style>
:root{--canvas:#FDFCF8;--surface:#FFFFFF;--row:#F6F6F5;--line:#E6E0D7;--ink:#171716;--muted:#6B6B69;--alert:#FF6B5B;--alert-solid:#C23E2E;--alert-ink:#B83A2B;--alert-tint:#FFE4DF;--pending:#EBC36B;--pending-ink:#6E5200;--pending-tile:#FFF0C4;--done-ink:#1E7A4C;--done-tint:#DDF3E6;--info:#D7E1FE;--info-ink:#2B3A75;--info-line:#C3D0F7;--act:#2B3A75;--act-text:#FFFFFF;--neutral-tile:#EDEDEC;--neutral-ink:#6B6B69;--r-btn:14px;--r-card:20px;--r-pill:999px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-7:32px;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--canvas:#1B1B1A;--surface:#262625;--row:#232322;--line:#38383a;--ink:#FFFFFF;--muted:#9B9B98;--alert:#E8705C;--alert-solid:#E8705C;--alert-ink:#F59384;--alert-tint:#3A2420;--pending:#EBC36B;--pending-ink:#EBC36B;--pending-tile:#3A3122;--done-ink:#74C99A;--done-tint:#244232;--info:#252C42;--info-ink:#DCE4FF;--info-line:#34405E;--act:#C9D4FB;--act-text:#1A2140;--neutral-tile:#2A2A29;--neutral-ink:#9B9B98;color-scheme:dark}}
:root[data-theme="dark"]{--canvas:#1B1B1A;--surface:#262625;--row:#232322;--line:#38383a;--ink:#FFFFFF;--muted:#9B9B98;--alert:#E8705C;--alert-solid:#E8705C;--alert-ink:#F59384;--alert-tint:#3A2420;--pending:#EBC36B;--pending-ink:#EBC36B;--pending-tile:#3A3122;--done-ink:#74C99A;--done-tint:#244232;--info:#252C42;--info-ink:#DCE4FF;--info-line:#34405E;--act:#C9D4FB;--act-text:#1A2140;--neutral-tile:#2A2A29;--neutral-ink:#9B9B98;color-scheme:dark}:root{--biz-pink:#FBB9C2;--biz-pink-ink:#171716}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:'Manrope',system-ui,sans-serif}button{font:inherit;cursor:pointer}svg{width:18px;height:18px}.app{max-width:520px;margin:0 auto;padding:12px 16px 112px}.new{padding:10px 12px;border-radius:var(--r-card);background:var(--info);color:var(--info-ink);font-size:11.5px;line-height:1.45;margin-bottom:12px}.new strong{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.mark{width:38px;height:38px;border-radius:50%;background:var(--biz-pink);color:var(--biz-pink-ink);display:grid;place-items:center;font-weight:800}.business{flex:1}.business strong{display:block;font-size:14px}.business small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center}.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}.heading h1{font-size:26px;margin:0}.month{height:40px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--surface);color:var(--ink);font-size:12px;font-weight:750;display:flex;align-items:center;gap:6px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.card{border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface)}.metric{padding:13px 14px}.metric span{display:block;color:var(--muted);font-size:10.5px;font-weight:700}.metric strong{display:block;font-size:23px;margin-top:3px}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 10px}.tab{flex:none;min-height:34px;padding:0 11px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:11px;font-weight:800}.tab.on{background:var(--ink);color:var(--canvas);border-color:var(--ink)}.list-head{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 6px}.list-head strong{font-size:12px}.list-head span{font-size:10.5px;color:var(--muted)}.list{overflow:hidden}.row{width:100%;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:12px 13px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;text-align:left;color:var(--ink)}.row:last-child{border-bottom:0}.name{font-size:13px;font-weight:800}.place{font-size:10.5px;color:var(--muted);margin-top:3px}.state{margin-top:6px}.pill{display:inline-flex;border-radius:var(--r-pill);padding:4px 8px;font-size:10.5px;font-weight:800}.pill.alert{background:var(--alert-tint);color:var(--alert-ink)}.pill.pending{background:var(--pending-tile);color:var(--pending-ink)}.pill.done{background:var(--done-tint);color:var(--done-ink)}.amount{text-align:right;font-size:14px;font-weight:800}.period{text-align:right;color:var(--muted);font-size:10.5px;margin-top:3px}.fab{position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:82px;width:54px;height:54px;border-radius:18px;border:0;background:var(--act);color:var(--act-text);display:grid;place-items:center;z-index:45}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);height:72px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:40}.nav button{border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav button.on{color:var(--act)}.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 28%,transparent);display:none;z-index:70}.scrim.on{display:block}.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);transition:.35s;z-index:71;width:min(520px,100%);background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px 22px}.sheet.on{transform:translate(-50%,0)}.handle{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 17px}.sheet h2{font-size:18px;margin:0}.sheet p{margin:4px 0 14px;color:var(--muted);font-size:11px}.action-row{width:100%;border:0;border-top:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:52px;padding:0 2px;display:flex;align-items:center;gap:10px;text-align:left;font-weight:800;font-size:12px}.action-row .ico{width:34px;height:34px;border-radius:12px;background:var(--neutral-tile);display:grid;place-items:center;color:var(--act)}.action-row span:nth-child(2){flex:1}.menu{display:none;position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:146px;z-index:60;width:210px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px}.menu.on{display:block}.menu button{width:100%;height:42px;border:0;background:transparent;color:var(--ink);border-radius:12px;padding:0 10px;display:flex;align-items:center;gap:9px;text-align:left;font-weight:750;font-size:12px}
</style></head><body><main class="app"><div class="new"><strong>New in this file</strong><br>Collections standardized with Khaata UI components v5. Product structure remains obligation-first.</div><header class="top"><div class="mark">S</div><div class="business"><strong>Sunrise PG</strong><small>Collections</small></div><button class="ibtn" data-act="theme" aria-label="Toggle theme"><i data-lucide="sun-moon"></i></button></header><div class="heading"><h1>Collections</h1><button class="month"><i data-lucide="calendar-days"></i>October 2026</button></div><section class="summary"><div class="card metric"><span>Collected</span><strong>₹3.42L</strong></div><div class="card metric"><span>Outstanding</span><strong>₹28K</strong></div></section><div class="tabs"><button class="tab on" data-filter="attention">Needs attention</button><button class="tab" data-filter="due">Due</button><button class="tab" data-filter="paid">Paid</button><button class="tab" data-filter="all">All</button></div><div class="list-head"><strong id="listTitle">Needs attention</strong><span id="count"></span></div><section class="card list" id="list"></section></main><button class="fab" data-act="fab" aria-label="Quick actions"><i data-lucide="plus"></i></button><div class="menu" id="menu"><button data-action="Record payment"><i data-lucide="indian-rupee"></i>Record payment</button><button data-action="Add tenant"><i data-lucide="user-plus"></i>Add tenant</button><button data-action="Add expense"><i data-lucide="receipt-text"></i>Add expense</button><button data-action="Add charge"><i data-lucide="badge-plus"></i>Add charge</button></div><nav class="nav"><button><i data-lucide="house"></i>Home</button><button><i data-lucide="users"></i>Tenants</button><button class="on"><i data-lucide="indian-rupee"></i>Collections</button><button><i data-lucide="menu"></i>More</button></nav><div class="scrim" id="scrim"></div><section class="sheet" id="sheet"><div class="handle"></div><h2 id="sheetTitle"></h2><p id="sheetMeta"></p><button class="action-row" data-action="Record payment"><span class="ico"><i data-lucide="indian-rupee"></i></span><span>Record payment</span><i data-lucide="chevron-right"></i></button><button class="action-row" data-action="View statement"><span class="ico"><i data-lucide="scroll-text"></i></span><span>View statement</span><i data-lucide="chevron-right"></i></button><button class="action-row" data-action="Record promise"><span class="ico"><i data-lucide="calendar-clock"></i></span><span>Record promise</span><i data-lucide="chevron-right"></i></button></section><script>
const rows=[{name:'Rohan Mehta',place:'Room 203 · Bed B',amount:'₹4,500',period:'October rent',state:'Overdue',kind:'attention',tone:'alert'},{name:'Vivek Rao',place:'Room 108 · Bed A',amount:'₹6,000',period:'October rent',state:'Missed promise',kind:'attention',tone:'alert'},{name:'Neha Singh',place:'Room 304 · Bed B',amount:'₹5,500',period:'Older dues',state:'Overdue',kind:'attention',tone:'alert'},{name:'Aditya Jain',place:'Room 201 · Bed A',amount:'₹8,500',period:'October rent',state:'Due 8 Oct',kind:'due',tone:'pending'},{name:'Sara Khan',place:'Room 102 · Bed B',amount:'₹7,500',period:'October rent',state:'Due 10 Oct',kind:'due',tone:'pending'},{name:'Meera Nair',place:'Room 205 · Bed A',amount:'₹8,500',period:'October rent',state:'Paid 4 Oct',kind:'paid',tone:'done'},{name:'Kabir Shah',place:'Room 301 · Bed B',amount:'₹9,000',period:'October rent',state:'Paid 3 Oct',kind:'paid',tone:'done'}];let filter='attention';function icons(){if(window.lucide)lucide.createIcons()}function render(){const a=rows.filter(x=>filter==='all'||x.kind===filter);const titles={attention:'Needs attention',due:'Due this month',paid:'Paid this month',all:'All obligations'};listTitle.textContent=titles[filter];count.textContent=a.length+' obligations';list.innerHTML=a.map(x=>`<button class="row" data-row="${rows.indexOf(x)}"><div><div class="name">${x.name}</div><div class="place">${x.place}</div><div class="state"><span class="pill ${x.tone}">${x.state}</span></div></div><div><div class="amount">${x.amount}</div><div class="period">${x.period}</div></div></button>`).join('');icons()}function openSheet(x){sheetTitle.textContent=x.name+' · '+x.amount;sheetMeta.textContent=x.place+' · '+x.period+' · '+x.state;scrim.classList.add('on');sheet.classList.add('on')}function closeSheet(){scrim.classList.remove('on');sheet.classList.remove('on')}document.addEventListener('click',e=>{const t=e.target.closest('[data-filter]');if(t){filter=t.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('on',b===t));render();return}const r=e.target.closest('[data-row]');if(r){openSheet(rows[+r.dataset.row]);return}const a=e.target.closest('[data-act]');if(a?.dataset.act==='theme'){const root=document.documentElement;root.setAttribute('data-theme',root.getAttribute('data-theme')==='dark'?'light':'dark');return}if(a?.dataset.act==='fab'){menu.classList.toggle('on');return}if(e.target.closest('[data-action]')){menu.classList.remove('on');closeSheet()}});scrim.addEventListener('click',closeSheet);render();icons();</script></body></html>
