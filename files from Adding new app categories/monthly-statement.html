<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Monthly Statement</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#16161a;--mut:#62636a;--ln:#e7e7e2;--ac:#1f6f54;--sf:#e8f3ee;--wm:#f4f2ec;
--rd:#b3261e;--rs:#fdecea;--am:#b36b00;--as:#fff4e5;--bl:#2a5db0;--bs:#e8eef9;
--d:'Plus Jakarta Sans',system-ui,sans-serif;--b:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fbfbf9;color:var(--ink);font-family:var(--b);padding-bottom:88px;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--d);letter-spacing:-.01em}
.top{position:sticky;top:0;background:#fbfbf9;z-index:9;padding:13px 0;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:11px}
.top .bk{font-size:20px;color:var(--mut);cursor:pointer}.top h1{font-size:18px;flex:1}.top .s{font-size:12px;color:var(--mut)}
/* mode toggle */
.modetog{display:flex;gap:6px;background:var(--wm);border-radius:11px;padding:4px;margin:14px 0 10px}
.modetog button{flex:1;border:none;background:none;padding:11px;border-radius:8px;font-family:var(--d);font-weight:700;font-size:13px;color:var(--mut);cursor:pointer}
.modetog button.on{background:#fff;color:var(--ac);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* month / picker bar */
.pickbar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:9px 12px;margin-bottom:12px}
.pickbar .a{width:30px;height:30px;border-radius:8px;border:1px solid var(--ln);background:#fbfbf9;font-size:15px;cursor:pointer}
.pickbar .m{flex:1;text-align:center;font-family:var(--d);font-weight:700;font-size:14px}
.custsel{width:100%;padding:12px;border:1px solid var(--ln);border-radius:11px;font-size:15px;font-family:var(--b);background:#fff;margin-bottom:12px}
/* hero */
.hero{border-radius:16px;padding:17px;margin-bottom:12px;color:#fff}
.hero.sales{background:linear-gradient(150deg,#1f6f54,#175843);box-shadow:0 8px 24px rgba(31,111,84,.2)}
.hero.owe{background:linear-gradient(150deg,#b36b00,#8a5200);box-shadow:0 8px 24px rgba(179,107,0,.2)}
.hero.clear{background:linear-gradient(150deg,#1f6f54,#175843)}
.hero .lbl{font-size:12px;opacity:.85;font-weight:600}
.hero .big{font-family:var(--d);font-weight:800;font-size:31px;letter-spacing:-.02em;margin:2px 0 1px}
.hero .meta{font-size:12.5px;opacity:.9}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:15px;margin-bottom:12px}
.sh{font-family:var(--d);font-weight:700;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:0 2px 10px}
/* split */
.split{display:flex;gap:8px}
.split .x{flex:1;background:#fbfbf9;border-radius:11px;padding:11px 10px;text-align:center}
.split .v{font-family:var(--d);font-weight:800;font-size:16px}.split .l{font-size:10.5px;color:var(--mut);margin-top:2px}
.split .v.cash{color:var(--ac)}.split .v.upi{color:var(--bl)}.split .v.credit{color:var(--am)}
/* rows */
.line{display:flex;justify-content:space-between;padding:10px 0;font-size:13.5px;border-bottom:1px solid var(--ln)}
.line:last-child{border:none}.line .k{color:var(--mut)}.line .v{font-family:var(--d);font-weight:700}
.line.tot{font-size:15px;padding-top:12px}.line.tot .v{color:var(--ac)}
/* GST */
.gstcard .grid{display:flex;gap:8px;margin-bottom:4px}
.gstcard .gx{flex:1;background:var(--sf);border-radius:10px;padding:10px;text-align:center}
.gstcard .gx .gv{font-family:var(--d);font-weight:800;font-size:15px;color:var(--ac)}.gstcard .gx .gl{font-size:10px;color:var(--mut);margin-top:1px}
.gsthint{font-size:11px;color:var(--mut);margin-top:9px;line-height:1.4}
/* top items */
.ti{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--ln)}
.ti:last-child{border:none}
.ti .rank{width:22px;height:22px;border-radius:6px;background:var(--sf);color:var(--ac);display:flex;align-items:center;justify-content:center;font-family:var(--d);font-weight:800;font-size:11px;flex-shrink:0}
.ti .tn{flex:1;font-size:13.5px;font-weight:500}.ti .tq{font-size:11.5px;color:var(--mut)}
.ti .tv{font-family:var(--d);font-weight:700;font-size:13.5px}
/* customer txns */
.txn{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--ln)}
.txn:last-child{border:none}
.txn .ti2{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.ti2.buy{background:var(--as)}.ti2.pay{background:var(--sf)}
.txn .mid{flex:1}.txn .tt{font-family:var(--d);font-weight:700;font-size:13.5px}.txn .td{font-size:11px;color:var(--mut);margin-top:1px}
.txn .amt{font-family:var(--d);font-weight:800;font-size:14px}
.amt.buy{color:var(--am)}.amt.pay{color:var(--ac)}
.fab{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#fbfbf9 22%);padding:16px;display:flex;justify-content:center;gap:10px}
.fab .in{max-width:480px;width:100%;display:flex;gap:10px}
.fab .wa{flex:1;background:#1f6f54;color:#fff;border:none;border-radius:13px;padding:15px;font-family:var(--d);font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 16px rgba(31,111,84,.3);display:flex;align-items:center;justify-content:center;gap:8px}
.fab .pdf{flex:0 0 auto;background:#fff;border:1px solid var(--ln);color:var(--ink);border-radius:13px;padding:15px 18px;font-family:var(--d);font-weight:700;font-size:15px;cursor:pointer}
.hidden{display:none}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body>
<div class="top wrap"><span class="bk">←</span><div style="flex:1"><h1>Monthly Statement</h1><div class="s">Sharma General Store</div></div></div>
<div class="wrap">
  <div class="modetog"><button class="on" id="mShop" onclick="setMode('shop')">Shop summary</button><button id="mCust" onclick="setMode('cust')">Customer statement</button></div>

  <div class="pickbar"><button class="a" onclick="shiftMonth(-1)">‹</button><div class="m" id="monthLbl">June 2026</div><button class="a" onclick="shiftMonth(1)">›</button></div>

  <select class="custsel hidden" id="custSel" onchange="render()">
    <option value="ramesh">Ramesh Kumar — ₹4,200 due</option>
    <option value="lakshmi">Lakshmi Stores — ₹0</option>
    <option value="anil">Anil Traders — ₹1,850 due</option>
  </select>

  <div id="body"></div>
</div>

<div class="fab"><div class="in">
  <button class="wa" onclick="toast('Shares statement PDF via WhatsApp')">💬 <span id="waLbl">Share on WhatsApp</span></button>
  <button class="pdf" onclick="toast('Exports PDF')">PDF</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
var mode='shop', gstOn=true, monthIdx=5; // June
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
/* shop month data */
var shop={sales:412500,bills:684,cash:248000,upi:132500,credit:32000,
 taxable:349576,cgst:31462,sgst:31462,igst:0,
 top:[{n:'UltraTech Cement 50kg',q:'210 bags',v:86100},{n:'Asian Paints Apcolite',q:'92 L',v:31280},{n:'TMT Steel 12mm',q:'420 kg',v:28560},{n:'Wall Putty 40kg',q:'24 bags',v:25200},{n:'PVC Pipe 1inch',q:'118 pcs',v:17110}]};
/* customer statements */
var custs={
 ramesh:{name:'Ramesh Kumar',phone:'98xxxxxx12',open:2400,txns:[
   {t:'buy',d:'03 Jun',desc:'Bill INV-0912 · 8 items',amt:1800},
   {t:'pay',d:'10 Jun',desc:'Payment · UPI',amt:2000},
   {t:'buy',d:'18 Jun',desc:'Bill INV-0998 · 5 items',amt:2200},
   {t:'buy',d:'25 Jun',desc:'Bill INV-1030 · 3 items',amt:800},
 ]},
 lakshmi:{name:'Lakshmi Stores',phone:'97xxxxxx45',open:0,txns:[
   {t:'buy',d:'08 Jun',desc:'Bill INV-0950 · 12 items',amt:5400},
   {t:'pay',d:'08 Jun',desc:'Payment · Cash',amt:5400},
 ]},
 anil:{name:'Anil Traders',phone:'99xxxxxx78',open:1000,txns:[
   {t:'buy',d:'14 Jun',desc:'Bill INV-0975 · 4 items',amt:1650},
   {t:'pay',d:'20 Jun',desc:'Payment · Bank',amt:800},
 ]},
};
var $=function(i){return document.getElementById(i)};
function money(n){return '\u20b9'+(+n||0).toLocaleString('en-IN')}

function setMode(m){mode=m;$('mShop').classList.toggle('on',m==='shop');$('mCust').classList.toggle('on',m==='cust');
 $('custSel').classList.toggle('hidden',m!=='cust');
 $('waLbl').textContent=m==='cust'?'Send to customer':'Share on WhatsApp';
 render();}
function shiftMonth(n){monthIdx=(monthIdx+n+12)%12;$('monthLbl').textContent=MONTHS[monthIdx]+' 2026';render();}

function shopView(){
 var s=shop;
 var h='<div class="hero sales"><div class="lbl">Total sales \u00b7 '+MONTHS[monthIdx]+'</div><div class="big">'+money(s.sales)+'</div><div class="meta">'+s.bills+' bills \u00b7 avg '+money(Math.round(s.sales/s.bills))+'</div></div>';
 h+='<div class="card"><div class="sh">How you got paid</div><div class="split"><div class="x"><div class="v cash">'+money(s.cash)+'</div><div class="l">Cash</div></div><div class="x"><div class="v upi">'+money(s.upi)+'</div><div class="l">UPI</div></div><div class="x"><div class="v credit">'+money(s.credit)+'</div><div class="l">Udhaar</div></div></div></div>';
 if(gstOn){
  h+='<div class="card gstcard"><div class="sh">GST collected \u2014 for filing</div>'
   +'<div class="grid"><div class="gx"><div class="gv">'+money(s.cgst)+'</div><div class="gl">CGST</div></div><div class="gx"><div class="gv">'+money(s.sgst)+'</div><div class="gl">SGST</div></div><div class="gx"><div class="gv">'+money(s.igst)+'</div><div class="gl">IGST</div></div></div>'
   +'<div class="line" style="margin-top:8px"><span class="k">Taxable value</span><span class="v">'+money(s.taxable)+'</span></div>'
   +'<div class="line tot"><span class="k">Total GST collected</span><span class="v">'+money(s.cgst+s.sgst+s.igst)+'</span></div>'
   +'<div class="gsthint">Summary only \u2014 for your GSTR filing. Tap PDF for the full tax report.</div></div>';
 }
 h+='<div class="card"><div class="sh">Top sellers this month</div>'+s.top.map(function(t,i){return '<div class="ti"><div class="rank">'+(i+1)+'</div><div style="flex:1"><div class="tn">'+t.n+'</div><div class="tq">'+t.q+'</div></div><div class="tv">'+money(t.v)+'</div></div>'}).join('')+'</div>';
 return h;
}
function custView(){
 var c=custs[$('custSel').value];
 var bought=c.txns.filter(function(t){return t.t==='buy'}).reduce(function(a,t){return a+t.amt},0);
 var paid=c.txns.filter(function(t){return t.t==='pay'}).reduce(function(a,t){return a+t.amt},0);
 var close=c.open+bought-paid;
 var heroCls=close>0?'owe':'clear';
 var h='<div class="hero '+heroCls+'"><div class="lbl">'+c.name+' \u00b7 '+MONTHS[monthIdx]+'</div><div class="big">'+money(Math.abs(close))+'</div><div class="meta">'+(close>0?'still to collect':'fully settled \u2014 nothing due')+'</div></div>';
 h+='<div class="card">'
  +'<div class="line"><span class="k">Opening balance</span><span class="v">'+money(c.open)+'</span></div>'
  +'<div class="line"><span class="k">Bought this month</span><span class="v" style="color:var(--am)">+ '+money(bought)+'</span></div>'
  +'<div class="line"><span class="k">Paid this month</span><span class="v" style="color:var(--ac)">\u2212 '+money(paid)+'</span></div>'
  +'<div class="line tot"><span class="k">Closing balance</span><span class="v">'+money(close)+'</span></div></div>';
 h+='<div class="card"><div class="sh">This month\u2019s activity</div>'+c.txns.map(function(t){return '<div class="txn"><div class="ti2 '+t.t+'">'+(t.t==='buy'?'\ud83d\uded2':'\u2713')+'</div><div class="mid"><div class="tt">'+(t.t==='buy'?'Purchase':'Payment')+'</div><div class="td">'+t.d+' \u00b7 '+t.desc+'</div></div><div class="amt '+t.t+'">'+(t.t==='buy'?'+':'\u2212')+money(t.amt)+'</div></div>'}).join('')+'</div>';
 return h;
}
function render(){$('body').innerHTML=mode==='shop'?shopView():custView();}
var tT;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(function(){t.classList.remove('on')},1700);}
render();
</script></body></html>
