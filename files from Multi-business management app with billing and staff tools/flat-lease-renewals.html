<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lease Renewals — Khaata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1f6f54; --green-light: #e7f2ed;
    --parchment: #fbfbf9; --ink: #1c1c1a; --muted: #6b6b64;
    --border: #e6e4dd; --amber: #b5791f; --amber-light: #fbf1e2;
    --red: #b3261e; --red-light: #fbeceb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif; background: var(--parchment); color: var(--ink);
    max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 40px;
  }
  header { padding: 24px 20px 12px; }
  header h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 800; }
  header p { font-size: 13px; color: var(--muted); margin-top: 3px; }

  .summary-bar { display: flex; justify-content: space-between; padding: 4px 20px 14px; font-size: 13px; color: var(--muted); }
  .summary-bar b { color: var(--ink); }

  .sort-row { display: flex; gap: 8px; margin: 0 20px 14px; }
  .sort-opt { flex: 1; text-align: center; padding: 8px 6px; border-radius: 999px; border: 1px solid var(--border); font-size: 11.5px; font-weight: 700; cursor: pointer; background: #fff; color: var(--muted); }
  .sort-opt.selected { border-color: var(--green); background: var(--green-light); color: var(--green); }

  .lease-row { background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 12px; padding: 14px 16px; margin: 0 20px 10px; }
  .lease-row.urgent { border-left-color: var(--red); }
  .lease-row.soon { border-left-color: var(--amber); }
  .lease-row.ok { border-left-color: var(--green); }
  .lease-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .lease-name { font-weight: 700; font-size: 14.5px; }
  .lease-unit { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .lease-days { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; flex-shrink: 0; }
  .lease-days.urgent { background: var(--red-light); color: var(--red); }
  .lease-days.soon { background: var(--amber-light); color: var(--amber); }
  .lease-days.ok { background: var(--green-light); color: var(--green); }
  .lease-dates { font-size: 11.5px; color: var(--muted); margin-top: 8px; }
  .lease-actions { display: flex; gap: 8px; margin-top: 10px; }
  .lease-actions button { flex: 1; padding: 9px; border-radius: 8px; border: none; font-weight: 700; font-size: 12px; cursor: pointer; }
  .btn-remind { background: var(--green); color: #fff; }
  .btn-renewed { background: var(--green-light); color: var(--green); border: 1px solid var(--green) !important; }

  .empty-note { text-align: center; padding: 30px 20px; color: var(--muted); font-size: 13px; }
  .resolved-note { font-size: 11.5px; color: var(--green); font-weight: 700; text-align: center; padding: 6px; }
</style>
</head>
<body>

<header>
  <h1>Lease Renewals</h1>
  <p>Green Residency — leases approaching expiry</p>
</header>

<div class="summary-bar">
  <span><b id="urgentCount">0</b> urgent (&lt;15 days)</span>
  <span><b id="soonCount">0</b> upcoming (15–60 days)</span>
</div>

<div class="sort-row" id="sortRow"></div>

<div id="leaseList"></div>

<script>
const REFERENCE_TODAY = new Date('2026-07-15');

let leases = [
  { id: 'l1', tenant: 'Ravi Kumar', unit: 'Flat 101', start: '2025-08-01', end: '2026-07-25', status: 'active' },
  { id: 'l2', tenant: 'Priya Nair', unit: 'Flat 102', start: '2025-09-15', end: '2026-08-20', status: 'active' },
  { id: 'l3', tenant: 'Anil Sharma', unit: 'Flat 104', start: '2026-01-10', end: '2026-12-05', status: 'active' },
  { id: 'l4', tenant: 'Sunita Devi', unit: 'Flat 105', start: '2025-07-20', end: '2026-07-18', status: 'active' },
  { id: 'l5', tenant: 'Manoj Verma', unit: 'Flat 107', start: '2025-10-01', end: '2026-09-01', status: 'active' }
];

let sortMode = 'urgency'; // 'urgency' | 'date'

function daysUntil(dateStr) {
  const target = new Date(dateStr);
  return Math.round((target - REFERENCE_TODAY) / 86400000);
}

function urgencyClass(days) {
  if (days <= 15) return 'urgent';
  if (days <= 60) return 'soon';
  return 'ok';
}

function fmtDate(dateStr) {
  return new Date(dateStr).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

function renderSortRow() {
  const container = document.getElementById('sortRow');
  container.innerHTML = '';
  [{ key: 'urgency', label: 'Most Urgent First' }, { key: 'date', label: 'By Expiry Date' }].forEach(function(o) {
    const btn = document.createElement('div');
    btn.className = 'sort-opt' + (sortMode === o.key ? ' selected' : '');
    btn.textContent = o.label;
    btn.onclick = function() { sortMode = o.key; renderSortRow(); renderList(); };
    container.appendChild(btn);
  });
}

function renderList() {
  const container = document.getElementById('leaseList');
  container.innerHTML = '';

  const active = leases.filter(function(l) { return l.status === 'active'; });
  const withDays = active.map(function(l) { return Object.assign({}, l, { days: daysUntil(l.end) }); });

  let sorted = withDays.slice();
  if (sortMode === 'urgency') {
    sorted.sort(function(a, b) { return a.days - b.days; });
  } else {
    sorted.sort(function(a, b) { return new Date(a.end) - new Date(b.end); });
  }

  if (!sorted.length) {
    container.innerHTML = '<div class="empty-note">No upcoming lease renewals — nice and quiet.</div>';
  }

  let urgentCount = 0, soonCount = 0;
  sorted.forEach(function(l) {
    const uc = urgencyClass(l.days);
    if (uc === 'urgent') urgentCount++;
    if (uc === 'soon') soonCount++;

    const row = document.createElement('div');
    row.className = 'lease-row ' + uc;
    row.innerHTML =
      '<div class="lease-top"><div><div class="lease-name"></div><div class="lease-unit"></div></div>' +
      '<span class="lease-days ' + uc + '"></span></div>' +
      '<div class="lease-dates"></div>' +
      '<div class="lease-actions">' +
      '<button class="btn-remind" onclick="sendReminder(\'' + l.id + '\')">💬 Remind (WhatsApp)</button>' +
      '<button class="btn-renewed" onclick="markRenewed(\'' + l.id + '\')">✓ Mark Renewed</button>' +
      '</div>';
    row.querySelector('.lease-name').textContent = l.tenant;
    row.querySelector('.lease-unit').textContent = l.unit;
    row.querySelector('.lease-days').textContent = l.days < 0 ? Math.abs(l.days) + ' days overdue' : l.days + ' days left';
    row.querySelector('.lease-dates').textContent = fmtDate(l.start) + ' → ' + fmtDate(l.end);
    container.appendChild(row);
  });

  document.getElementById('urgentCount').textContent = urgentCount;
  document.getElementById('soonCount').textContent = soonCount;
}

function sendReminder(id) {
  const l = leases.find(function(x) { return x.id === id; });
  alert('WhatsApp reminder sent to ' + l.tenant + ':\n\n"Hi ' + l.tenant + ', your lease for ' + l.unit + ' ends on ' + fmtDate(l.end) + '. Please reach out to discuss renewal at your convenience."');
}

function markRenewed(id) {
  if (!confirm('Mark this lease as renewed? It will be removed from this list.')) return;
  const l = leases.find(function(x) { return x.id === id; });
  const newEnd = prompt('New lease end date (YYYY-MM-DD):', '');
  if (newEnd) {
    l.start = REFERENCE_TODAY.toISOString().slice(0, 10);
    l.end = newEnd;
  } else {
    l.status = 'renewed_unspecified';
  }
  renderList();
}

renderSortRow();
renderList();
</script>
</body>
</html>
